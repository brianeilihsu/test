<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trendy Merch Store</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-white text-gray-900">
  <div id="app"></div>

  <script type="module">
    import { createApp, ref } from 'vue'

    const App = {
      template: `
        <div>
          <header class="text-center py-10 bg-gray-100 shadow">
            <h1 class="text-4xl font-bold">🔥 Trendy Merch Store</h1>
            <p class="text-gray-500">Shop the latest in streetwear</p>
          </header>

          <main class="max-w-6xl mx-auto px-4 py-10">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
              <div v-for="item in items" :key="item.name" class="rounded-2xl shadow p-4 border hover:shadow-lg transition-all">
                <img :src="item.image" :alt="item.name" class="w-full h-48 object-cover rounded-xl mb-2">
                <h3 class="text-xl font-semibold mb-1">{{ item.name }}</h3>
                <p class="text-gray-600 mb-2">{{ item.description }}</p>
                <div class="text-lg font-bold">{{ item.price }}</div>
                <button class="mt-3 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
                  Add to Cart
                </button>
              </div>
            </div>
          </main>
        </div>
      `,
      setup() {
        const items = ref([
          {
            name: 'Cool Hoodie',
            description: 'Comfortable and stylish hoodie',
            price: '$49.99',
            image: 'https://via.placeholder.com/300x200.png?text=Hoodie'
          },
          {
            name: 'Graphic T-Shirt',
            description: 'High-quality cotton T-shirt',
            price: '$24.99',
            image: 'https://via.placeholder.com/300x200.png?text=T-Shirt'
          },
          {
            name: 'Bucket Hat',
            description: 'Trendy streetwear bucket hat',
            price: '$19.99',
            image: 'https://via.placeholder.com/300x200.png?text=Hat'
          }
        ])
        return { items }
      }
    }

    createApp(App).mount('#app')
  </script>
</body>
</html>
